<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Receiver Output</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Montserrat:wght@500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="display.css">
</head>
<body class="bg-transparent lyric-scrim">
  <div id="stage" class="layout-lower-third">
    <div id="media"><video id="video" muted playsinline preload="auto"></video><img id="image" alt=""></div>
    <div id="dim"></div>
    <div id="scrim"></div>
    <div id="plate"></div>
    <div id="content"></div>
    <div id="speaker" aria-live="polite">
      <div class="sp-bar"></div>
      <div class="sp-panel">
        <div class="sp-name"><span></span></div>
        <div class="sp-title"><span></span></div>
      </div>
    </div>
    <div id="message"></div>
    <div id="status"><span class="dot"></span><span class="label">Connecting…</span></div>
  </div>
  <div id="fsHint" role="status"></div>
  <script src="display.js"></script>
</body>
</html>
